<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameDownloads</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --accent: #00ff9d;
      --text: #e0e0e0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #16213e 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 3.5rem;
      background: linear-gradient(90deg, #00ff9d, #00b36b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.8;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .dropdown-section {
      background: var(--card);
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    select {
      padding: 14px 20px;
      font-size: 1.1rem;
      border-radius: 12px;
      border: none;
      background: #16213e;
      color: white;
      width: 100%;
      max-width: 500px;
      margin: 15px 0;
      cursor: pointer;
    }

    .download-btn {
      background: var(--accent);
      color: black;
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 255, 157, 0.4);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .game-card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .game-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 255, 157, 0.2);
    }

    .game-image {
      height: 180px;
      background: #16213e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }

    .game-info {
      padding: 20px;
    }

    .game-info h3 {
      margin-bottom: 8px;
      color: var(--accent);
    }

    .game-info p {
      opacity: 0.7;
      font-size: 0.95rem;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>GameDownloads</h1>
      <p class="subtitle">Download your favorite games instantly</p>
    </header>

    <!-- Dropdown Section -->
    <div class="dropdown-section">
      <h2>Select a Game to Download</h2>
      <select id="gameSelect">
        <option value="">-- Choose a game --</option>
        <option value="games/elden-ring.zip">Elden Ring - Ultimate Edition</option>
        <option value="games/cyberpunk2077.zip">Cyberpunk 2077</option>
        <option value="games/gta-v.zip">Grand Theft Auto V</option>
        <option value="games/hades2.zip">Hades II</option>
        <option value="games/stardew-valley.zip">Stardew Valley</option>
        <option value="games/minecraft.zip">Minecraft Java + Mods</option>
      </select>
      <br>
      <button class="download-btn" onclick="downloadSelected()">Download Selected Game</button>
    </div>

    <!-- Games Grid -->
    <h2 style="margin-bottom: 20px; text-align: center;">Available Games</h2>
    <div class="games-grid">
      <div class="game-card">
        <div class="game-image">⚔️</div>
        <div class="game-info">
          <h3>Elden Ring</h3>
          <p>Ultimate Edition with all DLCs</p>
          <button class="download-btn" onclick="downloadGame('games/elden-ring.zip')">Download ZIP</button>
        </div>
      </div>

      <div class="game-card">
        <div class="game-image">🌃</div>
        <div class="game-info">
          <h3>Cyberpunk 2077</h3>
          <p>Complete Edition + Phantom Liberty</p>
          <button class="download-btn" onclick="downloadGame('games/cyberpunk2077.zip')">Download ZIP</button>
        </div>
      </div>

      <div class="game-card">
        <div class="game-image">🚗</div>
        <div class="game-info">
          <h3>Grand Theft Auto V</h3>
          <p>Full Game + All Updates</p>
          <button class="download-btn" onclick="downloadGame('games/gta-v.zip')">Download ZIP</button>
        </div>
      </div>

      <div class="game-card">
        <div class="game-image">🏛️</div>
        <div class="game-info">
          <h3>Hades II</h3>
          <p>Early Access Build</p>
          <button class="download-btn" onclick="downloadGame('games/hades2.zip')">Download ZIP</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function downloadGame(path) {
      const link = document.createElement('a');
      link.href = path;
      link.download = path.split('/').pop();
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadSelected() {
      const select = document.getElementById('gameSelect');
      const value = select.value;
      
      if (!value) {
        alert("Please select a game first!");
        return;
      }
      
      downloadGame(value);
    }
  </script>
</body>
</html>
