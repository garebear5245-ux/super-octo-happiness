<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameDownloads</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #16161f;
      --accent: #00ffaa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
   
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
      color: #ddd;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00ffaa, #00cc88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 1.3rem;
      opacity: 0.8;
      margin-bottom: 40px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }
    select {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.1rem;
      background: #0f0f1a;
      color: white;
      border: 2px solid #00ffaa33;
      border-radius: 12px;
      margin: 20px 0;
      cursor: pointer;
    }
    .download-btn {
      background: var(--accent);
      color: black;
      font-weight: bold;
      font-size: 1.3rem;
      padding: 16px 50px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }
    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 255, 170, 0.4);
    }
    .info {
      margin-top: 30px;
      font-size: 0.95rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GameDownloads</h1>
    <p class="subtitle">Select and download HTML games</p>
    
    <div class="card">
      <h2>Select Game</h2>
     
      <select id="gameSelect">
        <option value="">-- Choose a game --</option>
      </select>
      
      <button class="download-btn" onclick="downloadSelected()">
        Download Selected Game
      </button>
      
      <div class="info">
        The downloaded zip contains a full HTML game you can play offline
      </div>
    </div>
  </div>

  <script>
    // === ADD YOUR GAMES HERE ===
    const games = [
      { name: "Chrome Dino Game", file: "games/ChromeDinoGame.zip" },
      { name: "SnowRider 3D", file: "games/snowrider.zip" },
      { name: "SubwaysSurfer", file: "games/subwaysurfer.zip" },
      { name: "Minecraft", file: "games/Minecrat.zip" },
      // Add more games below (follow the same format):
      // { name: "Game Name", file: "games/your-zip-name.zip" },
    ];

    // Populate dropdown
    const select = document.getElementById('gameSelect');
    select.innerHTML = '<option value="">-- Choose a game --</option>';

    games.forEach(game => {
      const option = document.createElement('option');
      option.value = game.file;
      option.textContent = game.name;
      select.appendChild(option);
    });

    function downloadSelected() {
      const select = document.getElementById('gameSelect');
      const path = select.value;
     
      if (!path) {
        alert("Please select a game first!");
        return;
      }

      const link = document.createElement('a');
      link.href = path;
      link.download = path.split('/').pop();   // Downloads with original zip name
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
